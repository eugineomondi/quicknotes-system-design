<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes — API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Talk to a real API.</p>
  </header>

  <main>
    <section>
      <button id="load-btn" type="button">Load notes</button>
      <p id="status"></p>
    </section>

    <section>
      <h2>Create a note</h2>
      <form id="note-form">
        <p>
          <label for="title-input">Title</label>
          <input type="text" id="title-input" name="title" maxlength="100">
        </p>
        <p>
          <label for="body-input">Body (optional)</label>
          <textarea id="body-input" name="body" rows="3"></textarea>
        </p>
        <button type="submit" id="submit-btn">Add note</button>
      </form>
    </section>

    <section>
      <h2>Your notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes</p>
  </footer>
</body>
</html>
